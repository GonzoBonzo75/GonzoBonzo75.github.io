:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}

:root[data-theme="dark"]{--bg:#121110;--fg:#ece9e1;--mut:#9a958a;--line:#2b2926;--accent:#e0584a;--tile:#1b1a18;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:18px 0 16px}
.brand{display:flex;align-items:center;gap:16px;font:600 15px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase}
.brand svg{width:80px;height:80px;display:block}
nav{display:flex;gap:28px;font:400 21px/1 var(--serif)}
@media (max-width:560px){nav{width:100%;justify-content:space-between;gap:8px;font-size:16px}}
nav a{padding:8px 0;border-bottom:1px solid transparent;color:var(--mut)}
nav a:hover,nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
footer{padding:22px 0 26px;font:400 12px/1.5 var(--sans);color:var(--mut);display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:48px}
/* home */
.hero{position:relative;flex:1;min-height:60svh;margin-top:4px;overflow:hidden;background:var(--tile)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 16px;color:#fff;font:500 11px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;background:linear-gradient(transparent,rgba(0,0,0,.45));display:flex;justify-content:space-between;gap:12px}
body.home footer{margin-top:18px}
/* work */
h1.pt{font:400 clamp(30px,5vw,46px)/1.1 var(--serif);letter-spacing:-.01em;margin:30px 0 6px}
.sub{color:var(--mut);font:400 12px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 22px}
.card{display:block;min-width:0}
.card .ph{aspect-ratio:3/2;background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,opacity .3s}
a.card:hover img{transform:scale(1.025)}
.card h3{font:400 22px/1.2 var(--serif);margin:12px 0 2px}
.card p{margin:0;color:var(--mut);font:400 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.card.soon .ph svg{width:44px;height:44px;opacity:.35}
.card.soon h3,.card.soon p{opacity:.6}
.tag{position:absolute;right:10px;top:10px;background:var(--bg);color:var(--mut);font:500 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:6px 8px}
/* gallery */
.gl{display:flex;flex-direction:column;gap:64px;align-items:center;margin-top:8px}
.gl figure{margin:0;width:min(100%,1040px)}
.gl img{display:block;width:100%;height:auto;max-height:78svh;object-fit:contain;background:var(--tile)}
.gl figcaption{max-width:62ch;margin-top:14px}
.gl .gt{font:400 22px/1.2 var(--serif)}
.gl .gd{margin:6px 0 0;color:var(--mut);font:400 17px/1.55 var(--serif)}
/* viewer */
.back{display:inline-block;margin-top:22px;font:500 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.back:hover{color:var(--fg)}
.viewer{position:relative;margin-top:14px;background:var(--tile);height:min(74svh,calc((100vw - 32px) * 1.1));display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;top:0;bottom:0;width:50%;border:0;background:none;cursor:pointer;color:var(--fg);font:300 34px/1 var(--sans);opacity:0;transition:opacity .2s;display:flex;align-items:center;padding:0 16px}
.hit.p{left:0;justify-content:flex-start}.hit.n{right:0;justify-content:flex-end}
.hit:hover,.hit:focus-visible{opacity:.65}
.hit span{background:var(--bg);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@media (hover:none){.hit{opacity:0}}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:8px 20px;flex-wrap:wrap;margin-top:12px;font:400 13px/1.4 var(--sans)}
.bar .t{font:400 20px/1.2 var(--serif)}
.bar .d{color:var(--mut);letter-spacing:.08em}
.thumbs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 auto;width:84px;aspect-ratio:3/2;border:0;padding:0;background:var(--tile);cursor:pointer;opacity:.55;outline-offset:2px}
.thumbs button[aria-current="true"]{opacity:1;outline:1px solid var(--fg)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.txt{max-width:62ch;margin:36px 0 0}
.txt p{font:400 19px/1.65 var(--serif);margin:0 0 1em}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;margin:26px 0 0;font:400 13px/1.5 var(--sans);max-width:62ch}
.facts dt{color:var(--mut);letter-spacing:.14em;text-transform:uppercase;font-size:11px;padding-top:2px}.facts dd{margin:0}
/* profile / contact */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:28px 56px;margin-top:6px}
@media (min-width:860px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,4fr)}}
.big{font:400 clamp(18px,1.8vw,21px)/1.55 var(--serif)}
.big.it{font-style:italic;font-size:clamp(16px,1.55vw,18.5px)}
.seal{width:96px;height:96px;display:block;margin:6px 0 18px}
.pf{margin:36px auto 0;width:min(100%,210px)}
.pf img{display:block;width:100%;height:auto}
.list a{border-bottom:1px solid var(--line)}.list a:hover{border-bottom-color:var(--fg)}
.row{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:130px 1fr;gap:12px;font:400 15px/1.5 var(--sans)}
.row span:first-child{color:var(--mut);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding-top:3px}
.fade{animation:f .5s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}a.card:hover img{transform:none}}
</style>

 app.innerHTML=`<a class="hero fade" href="#work" aria-label="Vai ai progetti"><img src="img/home.jpg" alt="Un cassonetto rovesciato brucia in mezzo alla strada, Torino"><div class="cap"><span>Torino</span><span>20 dicembre 2025</span></div></a>`}
function work(){app.innerHTML=`<div class="fade"><h1 class="pt">Portfolio</h1><p class="sub">Progetti documentari</p><div class="grid">${PROJ.map(p=>p.soon?
 `<div class="card soon"><div class="ph">${seal}<span class="tag">In preparazione</span></div><h3>${esc(p.title)}</h3><p>${esc([p.place,p.years].filter(Boolean).join(' · '))}</p></div>`:
 `<a class="card" href="#${p.id}"><div class="ph"><img loading="lazy" src="${p.cover}" alt="${esc(p.title)}"></div><h3>${esc(p.title)}</h3><p>${esc(p.place)} · ${esc(p.years)}</p></a>`).join('')}</div></div>`}
const GAL=[
 {f:'img/ask-05.jpg',t:'L’idrante',d:'Torino, corso Regina Margherita, 31 gennaio 2026. Il getto d’acqua taglia la sera e un fuoco d’artificio si apre sopra gli scudi: per un istante la città diventa un teatro di luce, mentre la notte, lì sotto, è ancora tutta da vivere.',a:'Un idrante colpisce il viale mentre esplode un fuoco d’artificio davanti al cordone di scudi'},
 {f:'img/ss-09.jpg',t:'A piedi nudi',d:'Taranto, 18 aprile 2025. Scalzi sull’asfalto, con i rosari che oscillano a ogni passo: qui il tempo si misura in passi lenti, e le promesse si pagano con i piedi.',a:'I piedi nudi di due confratelli in tunica bianca, con i rosari e un bastone, sull’asfalto'},
 {f:'img/co-02.jpg',t:'Il ritmo',d:'21 gennaio 2017. Il chitarrista si piega sullo strumento sotto un fascio di luce verde, e la musica gli esce dalle mani come una corrente.',a:'Un chitarrista in canotta suona sotto un fascio di luce verde'}
];
function gallery(){app.innerHTML=`<div class="fade"><h1 class="pt">Gallery</h1><div class="gl">${GAL.map(x=>`<figure><img loading="lazy" src="${x.f}" alt="${esc(x.a)}"><figcaption><div class="gt">${esc(x.t)}</div><p class="gd">${esc(x.d)}</p></figcaption></figure>`).join('')}</div></div>`}
function proj(p){cur=p;idx=0;
 app.innerHTML=`<div class="fade"><a class="back" href="#work">← Portfolio</a>
 <div class="viewer" id="vw" aria-roledescription="galleria" data-x="region" aria-label="Galleria"><button class="hit p" aria-label="Foto precedente"><span>‹</span></button><img id="vi" alt=""><button class="hit n" aria-label="Foto successiva"><span>›</span></button></div>
 <div class="bar"><span class="t" id="vt"></span><span class="d" id="vd"></span></div>
 <div class="thumbs" id="th">${p.photos.map((x,i)=>`<button data-i="${i}" aria-label="Foto ${i+1}"><img src="${x.f}" alt="" loading="lazy"></button>`).join('')}</div>
 <h1 class="pt">${esc(p.title)}</h1><p class="sub">${esc(p.place)} · ${esc(p.years)}</p>
 <div class="txt">${p.intro.map(t=>`<p>${esc(t)}</p>`).join('')}</div>
 <dl class="facts">${p.facts.map(f=>`<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join('')}</dl></div>`;
 const v=$('#vw');v.querySelector('.p').onclick=()=>go(-1);v.querySelector('.n').onclick=()=>go(1);
 $('#th').onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.i)};
 v.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
 v.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40)go(dx<0?1:-1)});
 show(startIdx);startIdx=0}
function show(i){const n=cur.photos.length;idx=(i+n)%n;const x=cur.photos[idx],im=$('#vi');im.src=x.f;im.alt=x.a;
 $('#vt').textContent=`${String(idx+1).padStart(2,'0')} / ${String(n).padStart(2,'0')} · ${x.t}`;$('#vd').textContent=`${cur.place} · ${x.d}`;
 document.querySelectorAll('#th button').forEach((b,k)=>b.setAttribute('aria-current',k===idx?'true':'false'));
 const nx=cur.photos[(idx+1)%n];(new Image).src=nx.f}
function go(d){show(idx+d)}
function profile(){app.innerHTML=`<div class="fade"><h1 class="pt">Profilo</h1><p class="sub">Fotografia documentaria</p><div class="cols">
 <div class="big it"><p>GENZO è un fotografo documentarista e un reporter. Va dove la storia si sta facendo: nelle piazze, nei cortei, nei riti che tornano ogni anno, e dove il mondo si incrina, fino alle zone di guerra.</p>
 <p>Ha imparato presto che le fotografie più vere arrivano quando l’evento è già un ricordo: un gesto che nessuno nota, una mano che si appoggia a una spalla, la cenere che si posa sull’asfalto. Per questo cerca la distanza giusta, che è quasi sempre poca, e aspetta. Lavora con un solo obiettivo, un 28 mm, che obbliga a stare dentro la scena e a farsi notare il meno possibile.</p>
 <p>Gli piacciono le notti lunghe, il rumore che scende, le facce stanche dopo la folla. Segue le storie finché non diventano un luogo che conosce, e non ha fretta di chiuderle: un reportage per lui è una promessa fatta alle persone che ha incontrato.</p>
 <p>Il sigillo rosso che firma le sue stampe è l’unica cosa che si concede di aggiungere. Il resto, luce, tempo e pazienza, lo mette la strada.</p><figure class="pf"><img loading="lazy" src="img/ritratto.jpg" alt="GENZO si fotografa allo specchio con una Fujifilm X-T4"></figure></div>
 <div><svg class="seal" viewBox="0 0 100 100" role="img" aria-label="Sigillo GENZO"><use href="#hanko"/></svg>
 <div class="row"><span>Base</span><span>Italia</span></div>
 <div class="row"><span>Lavora su</span><span>Reportage, foto documentaria</span></div>
 <div class="row"><span>Attrezzatura</span><span>Leica Q3</span></div></div></div></div>`}
function contact(){app.innerHTML=`<div class="fade"><h1 class="pt">Contatti</h1><p class="sub">Collaborazioni e richieste</p><div class="cols"><div class="big"><p>Per commissioni, collaborazioni o per vedere altri lavori, scrivimi una mail o seguimi su Instagram.</p></div>
 <div class="list"><div class="row"><span>Instagram</span><span><a href="https://www.instagram.com/bones_p75/" target="_blank" rel="noopener">@bones_p75</a></span></div>
 <div class="row"><span>Email</span><span><a href="mailto:stevegenzo@icloud.com">stevegenzo@icloud.com</a></span></div></div></div></div>`}
function route(){const h=(location.hash||'#home').slice(1);document.body.classList.toggle('home',h==='home');cur=null;
 document.querySelectorAll('nav a').forEach(a=>{const n=a.dataset.n;const on=h===n||(n==='work'&&PROJ.some(p=>p.id===h&&!p.soon));on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
 const p=PROJ.find(q=>q.id===h&&!q.soon);
 if(p)proj(p);else if(h==='work'||PROJ.some(q=>q.id===h))work();else if(h==='gallery')gallery();else if(h==='profile')profile();else if(h==='contact')contact();else home();
 window.scrollTo(0,0)}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(!cur)return;if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});
route();
</script>
</body>
</html>
