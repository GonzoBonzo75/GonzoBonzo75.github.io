<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{--bg:#fafaf7;--fg:#1d1c1a;--mut:#77736b;--line:#e3e0d8;--accent:#c23a2c;--tile:#efece4;--serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--fg:#ece9e1;--mut:#9a958a;--line:#2b2926;--accent:#e0584a;--tile:#1b1a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--fg:#ece9e1;--mut:#9a958a;--line:#2b2926;--accent:#e0584a;--tile:#1b1a18;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:18px 0 16px}
.brand{display:flex;align-items:center;gap:16px;font:600 15px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase}
.brand svg{width:80px;height:80px;display:block}
nav{display:flex;gap:28px;font:400 21px/1 var(--serif)}
@media (max-width:560px){nav{width:100%;justify-content:space-between;gap:4px;font-size:14px}}
@media (max-width:350px){nav{font-size:12.5px;gap:2px}}
nav a b{font-weight:700}
nav a{white-space:nowrap;padding:8px 0;border-bottom:1px solid transparent;color:var(--mut)}
nav a:hover,nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
.tools{order:3;display:flex;align-items:center;gap:8px}
.lg{font:600 12px/1 var(--sans);letter-spacing:.06em}
.tm{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:color .2s,border-color .2s}
.tm:hover,.tm:focus-visible{color:var(--accent);border-color:var(--accent)}
.tm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
header .brand{order:1}header nav{order:2;margin-left:auto}
@media (max-width:560px){header nav{order:3;margin-left:0}.tools{order:2;margin-left:auto}nav a[data-n="home"]{display:none}}
main{flex:1;display:flex;flex-direction:column;min-width:0}
footer{padding:22px 0 26px;font:400 12px/1.5 var(--sans);color:var(--mut);display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:48px}
/* home */
.hero{position:relative;flex:1;min-height:60svh;margin-top:4px;overflow:hidden;background:var(--tile)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.hero img{opacity:0;transition:opacity 1.4s ease}
.hero img.on{opacity:1}
.hero .cap span{transition:opacity .7s ease}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 16px;color:#fff;font:500 11px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;background:linear-gradient(transparent,rgba(0,0,0,.45));display:flex;justify-content:space-between;gap:12px}
.hero .tip{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:96px clamp(18px,3vw,44px) clamp(40px,5vw,64px);background:rgba(18,17,16,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);color:#fff;transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.hero .tip p{margin:0;max-width:74ch;font:italic 400 clamp(18px,1.9vw,25px)/1.5 var(--serif);transition:opacity .7s ease}
.hero .tip p.tl{align-self:flex-start;font:italic 400 clamp(17px,1.6vw,21px)/1.4 var(--serif);letter-spacing:.1em;text-transform:uppercase;text-decoration:underline;text-decoration-color:#c23a2c;text-decoration-thickness:2px;text-underline-offset:8px}
@media (hover:hover){.hero:hover .tip,.hero:focus-visible .tip{transform:none}.hero:hover .cap,.hero:focus-visible .cap{opacity:0}}
.hero .cap{transition:opacity .3s ease}
@media (hover:none){.hero .tip{display:none}}
@media (prefers-reduced-motion:reduce){.hero .tip{transition:none}}
body.home footer{margin-top:18px}
/* work */
h1.pt{font:400 clamp(30px,5vw,46px)/1.1 var(--serif);letter-spacing:-.01em;margin:30px 0 6px}
.sub{color:var(--mut);font:400 12px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 22px}
.card{display:block;min-width:0}
.card .ph{aspect-ratio:3/2;background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,opacity .3s}
a.card:hover img{transform:scale(1.025)}
.card h3{font:400 22px/1.2 var(--serif);margin:12px 0 2px;color:var(--accent)}
.card p{margin:0;color:var(--mut);font:400 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.card.soon .ph svg{width:44px;height:44px;opacity:.35}
.card.soon h3,.card.soon p{opacity:.6}
.card.soon.has h3,.card.soon.has p{opacity:1}
.card.soon.has .wm svg{width:100%;height:100%;opacity:1}
.card.pg h3,.card.pg p{opacity:1}
.card.pg{container-type:inline-size}
.card.pg .ph{aspect-ratio:4/3}
.card.pg h3.one{white-space:nowrap;font-size:min(22px,5.3cqw)}
.card .wm{position:absolute;left:50%;top:50%;width:clamp(44px,15%,70px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.35;pointer-events:none}
.card .wm svg{width:100%;height:100%;display:block}
.card.pg .pd{margin:12px 0 0;font:italic 400 16px/1.55 var(--serif);letter-spacing:0;text-transform:none;color:var(--fg)}
.tag{position:absolute;right:10px;top:10px;background:var(--bg);color:var(--mut);font:500 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:6px 8px}
/* gallery */
.gl{display:flex;flex-direction:column;gap:64px;align-items:center;margin-top:8px}
.gl figure{margin:0;width:min(100%,1040px)}
.gl img{display:block;width:100%;height:auto;max-height:78svh;object-fit:contain;background:var(--tile)}
.gl figcaption{max-width:62ch;margin-top:14px}
.gl .gt{font:400 22px/1.2 var(--serif)}
.gl .gd{margin:6px 0 0;color:var(--mut);font:400 17px/1.55 var(--serif)}
/* viewer */
.back{display:inline-block;margin-top:22px;font:500 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.back:hover{color:var(--fg)}
.viewer{position:relative;margin-top:14px;background:var(--tile);height:min(74svh,calc((100vw - 32px) * 1.1));display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;top:0;bottom:0;width:50%;border:0;background:none;cursor:pointer;color:var(--fg);font:300 34px/1 var(--sans);opacity:0;transition:opacity .2s;display:flex;align-items:center;padding:0 16px}
.hit.p{left:0;justify-content:flex-start}.hit.n{right:0;justify-content:flex-end}
.hit:hover,.hit:focus-visible{opacity:.65}
.hit span{background:var(--bg);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@media (hover:none){.hit{opacity:0}}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:8px 20px;flex-wrap:wrap;margin-top:12px;font:400 13px/1.4 var(--sans)}
.bar .t{font:400 20px/1.2 var(--serif)}
.bar .d{color:var(--mut);letter-spacing:.08em}
.thumbs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 auto;width:84px;aspect-ratio:3/2;border:0;padding:0;background:var(--tile);cursor:pointer;opacity:.55;outline-offset:2px}
.thumbs button[aria-current="true"]{opacity:1;outline:1px solid var(--fg)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.txt{max-width:62ch;margin:36px 0 0}
.txt p{font:400 19px/1.65 var(--serif);margin:0 0 1em}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;margin:26px 0 0;font:400 13px/1.5 var(--sans);max-width:62ch}
.facts dt{color:var(--mut);letter-spacing:.14em;text-transform:uppercase;font-size:11px;padding-top:2px}.facts dd{margin:0}
/* profile / contact */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:28px 56px;margin-top:6px}
@media (min-width:860px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,4fr)}}
.big{font:400 clamp(18px,1.8vw,21px)/1.55 var(--serif)}
.big.it{font-style:italic;font-size:clamp(16px,1.55vw,18.5px)}
.seal{width:96px;height:96px;display:block;margin:6px 0 18px}
.pf{margin:36px auto 0;width:min(100%,210px)}
.jna{margin:44px 0 0;padding-top:22px;border-top:1px solid var(--line);max-width:62ch}
.jna+.jna{margin-top:26px}
.jna .lb{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.jna a{border-bottom:1px solid var(--line);transition:color .2s,border-color .2s}
.jna a:hover,.jna a:focus-visible{color:var(--accent);border-color:var(--accent)}
.pf img{display:block;width:100%;height:auto}
.bl{display:flex;flex-direction:column;max-width:760px}
.bl a{display:block;padding:28px 0;border-top:1px solid var(--line)}
.bl a:last-child{border-bottom:1px solid var(--line)}
.bl .bd{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.bl .bt{font:400 clamp(24px,3vw,32px)/1.2 var(--serif);margin:10px 0 8px;text-wrap:balance}
.bl a:hover .bt{color:var(--accent)}
.bl .bx{font:italic 400 17px/1.55 var(--serif);color:var(--mut);margin:0}
.post{max-width:680px}
html:has(body.postv){overflow:hidden}
body.postv{height:100svh;overflow:hidden}
body.postv footer{display:none}
body.postv main{min-height:0}
.post.fr{display:flex;flex-direction:column;height:var(--ph,70vh);min-height:0}
.post.fr .pt0{flex:none;position:relative;z-index:1;background:var(--bg);padding-top:6px}
.post.fr h1{margin:0 0 10px}
.post.fr .ps{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 6px 40px 0;scrollbar-width:none;-ms-overflow-style:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30px);mask-image:linear-gradient(to bottom,transparent 0,#000 30px)}
.post.fr .ps::-webkit-scrollbar{display:none}
.post.fr .ps:focus-visible{outline:none}
.post .bd{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 14px}
.post h1 b,.bl .bt b{font-weight:700}
.post h1{font:400 clamp(30px,4.4vw,46px)/1.15 var(--serif);margin:0 0 28px;text-wrap:balance;color:var(--accent)}
.post p{font:italic 400 clamp(19px,1.6vw,21.5px)/1.7 var(--serif);margin:0 0 1.1em}
.post .cap{font-size:1.75em;line-height:0;letter-spacing:.01em}
.post img{display:block;width:100%;max-width:560px;height:auto;margin:32px auto}
.post .seal{width:72px;height:72px;margin:36px auto 0}
.post .ig{margin:-8px 0 28px;display:flex;justify-content:center}
.post .ig a{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);border:1px solid var(--line);border-radius:50%;transition:color .2s,border-color .2s}
.post .ig svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.post .ig a:hover,.post .ig a:focus-visible{color:var(--accent);border-color:var(--accent)}
.share{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin:8px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.share .lb{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-right:10px}
.share a,.share button{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);background:none;border:1px solid var(--line);border-radius:50%;padding:0;cursor:pointer;text-decoration:none;transition:color .2s,border-color .2s}
.share svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.share a:hover,.share button:hover,.share a:focus-visible,.share button:focus-visible{color:var(--accent);border-color:var(--accent)}
.share .ok{font:500 12px/1 var(--sans);color:var(--mut);margin-left:4px}
.shot{margin-top:12px}
.shot summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding:6px 0}
.shot summary::-webkit-details-marker{display:none}
.shot summary::before{content:'+';font:400 16px/1 var(--sans);width:12px}
.shot[open] summary::before{content:'\2212'}
.shot summary:hover,.shot summary:focus-visible{color:var(--fg)}
.shot .facts{margin-top:10px}
.lk{display:inline-block;font:500 13px/1.2 var(--sans);border-bottom:1px solid var(--line);padding-bottom:3px;transition:color .2s,border-color .2s}
.lk:hover,.lk:focus-visible{color:var(--accent);border-color:var(--accent)}
.pr .ph{aspect-ratio:3/2}
.pr .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-top:6px}
.pr .meta span{font:400 12px/1.4 var(--sans);color:var(--mut);letter-spacing:.08em}
.pr .lk{margin-top:12px}
.bl+.sb{border-top:0;margin-top:30px;padding-top:0}
.sb{margin:44px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.sb label{display:block;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.sb .sf{display:flex;gap:14px 16px;flex-wrap:wrap;align-items:flex-end}
.sb input{flex:1 1 220px;min-width:0;font:400 18px/1.2 var(--serif);color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--fg);border-radius:0;padding:10px 2px;outline-offset:3px}
.sb input::placeholder{color:var(--mut)}
.sb button{font:500 13px/1 var(--sans);color:var(--fg);background:none;border:1px solid var(--fg);border-radius:999px;padding:13px 24px;cursor:pointer;transition:color .2s,border-color .2s}
.sb button:hover,.sb button:focus-visible{color:var(--accent);border-color:var(--accent)}
.sb .nt{font:400 13px/1.5 var(--sans);color:var(--mut);margin:12px 0 0;max-width:62ch}
.sb .nt a{color:var(--fg)}
.list a{border-bottom:1px solid var(--line)}.list a:hover{border-bottom-color:var(--fg)}
.row{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:130px 1fr;gap:12px;font:400 15px/1.5 var(--sans)}
.row span:first-child{color:var(--mut);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding-top:3px}
.colp,.colb{width:100%;margin-inline:auto}.colp{max-width:680px}.colb{max-width:760px}
.fade{animation:f .5s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}a.card:hover img{transform:none}}
</style>
</head>

const BLOG=[
 {id:'il-foglio-e-la-fiamma',t:'Il foglio e la fiamma',d:'9 novembre 2026',x:'Una bolletta che brucia in corso Regina Margherita, a Torino.',img:'img/blog-02.jpg',ig:'https://www.instagram.com/bones_p75/',a:'Una manifestante tiene in alto una bolletta che brucia e, nell’altra mano, un fumogeno acceso, mentre intorno la gente la fotografa con i telefoni',p:[
  'Ci sono cose che pesano più della carta su cui sono scritte.',
  'Una bolletta, per esempio: un foglio piegato in tasca, un numero che a fine mese fa abbassare lo sguardo. E poi, per un istante, una fiamma che la prende e la restituisce al cielo.',
  'Dietro ogni bolletta c’è una cucina. Un tavolo, un cassetto dove si tengono i fogli, qualcuno che li apre per ultimi la sera, quando i bambini dormono, e li rimette via senza dire niente.',
  'Nei dati che l’Istat ha pubblicato a ottobre, riferiti al 2025, sono più di cinque milioni e quattrocentomila le persone in povertà assoluta, circa due milioni e centomila le famiglie, e tra loro più di un milione di minorenni. Non sono aumentate rispetto all’anno prima, e forse è proprio questo il punto: la fatica non fa più notizia, è diventata paesaggio. Né sono soltanto famiglie senza lavoro: dove chi porta a casa lo stipendio è un operaio, più di una famiglia su sette è povera.',
  'Sono famiglie che hanno imparato a fare i conti prima di accendere una luce, a rimandare una visita, a dire «un altro giorno» a un figlio che chiede una gita. Famiglie che si reggono in piedi a vicenda, e che in questo tempo sospeso si ritrovano a chiedersi non quanto spendere, ma quanto ancora resistere.',
  'Il 7 novembre, a Torino, in corso Regina Margherita, ho visto una di quelle bollette bruciare. In una mano il foglio in fiamme, nell’altra un fumogeno che sputava scintille: da una parte il peso, dall’altra la luce.',
  'Intorno, la luce che calava tra i rami e una fila di telefoni alzati, tutti a rubare lo stesso secondo.',
  'Non so dire cosa sia giusto chiedere, né a chi. Posso solo dire cosa ho visto: un gesto piccolo, quasi domestico, portato in strada davanti a tutti, come per mostrare quello che di solito si tiene in un cassetto.',
  'Io ero lì in mezzo, a cercare l’attimo in cui la rabbia somiglia a una festa e la festa, a guardarla bene, somiglia a una preghiera.'],
  en:{t:'The Sheet and the Flame',d:'9 November 2026',x:'A burning bill on Corso Regina Margherita, in Turin.',a:'A demonstrator holds up a burning bill and, in the other hand, a lit flare, while people around her photograph her with their phones',p:[
  'Some things weigh more than the paper they are written on.',
  'A bill, for instance: a sheet folded in a pocket, a number that makes you lower your eyes at the end of the month. And then, for a moment, a flame that takes it and gives it back to the sky.',
  'Behind every bill there is a kitchen. A table, a drawer where the papers are kept, someone who opens them last in the evening, when the children are asleep, and puts them away without a word.',
  'In the figures Istat published in October, for 2025, more than 5.4 million people live in absolute poverty, about 2.1 million families, and among them more than a million minors. They haven’t increased on the year before, and perhaps that is exactly the point: hardship is no longer news, it has become landscape. Nor are they only families without work: where the person bringing home a wage is a blue-collar worker, more than one family in seven is poor.',
  'These are families who have learned to do the sums before switching on a light, to put off a check-up, to say “another day” to a child who asks for a trip. Families who hold each other up, and who in this suspended time find themselves asking not how much to spend, but how much longer they can hold out.',
  'On 7 November, in Turin, on Corso Regina Margherita, I saw one of those bills burn. In one hand the sheet in flames, in the other a flare spitting sparks: on one side the weight, on the other the light.',
  'Around her, the light fading between the branches and a row of raised phones, all stealing the same second.',
  'I can’t say what is right to ask for, or from whom. I can only say what I saw: a small, almost domestic gesture, carried into the street in front of everyone, as if to show what is usually kept in a drawer.',
  'I was in the middle of it, looking for the moment when anger looks like a celebration and the celebration, if you look closely, looks like a prayer.']}},
 {id:'prima-del-grido',t:'Prima del grido',d:'9 novembre 2026',x:'Il pomeriggio di Napoli, quando una città intera trattiene il fiato.',img:'img/blog-01.jpg',ig:'https://www.instagram.com/bones_p75/',a:'Una mamma sorride tenendo in braccio la figlia, che con una mascherina sugli occhi come quella di Osimhen alza un fumogeno rosso e verde in un vicolo di Napoli',p:[
  'C’è un momento, prima di ogni festa, che nessuno fotografa. Non è il boato e non è il pianto: è il pomeriggio. A Napoli, il 4 maggio 2023, aveva il colore dell’attesa.',
  'Trentatré anni sono tanti. Sono una vita intera per chi li ha contati uno a uno, e un racconto di famiglia per chi era troppo piccolo per ricordarli. In quelle ore la città sembrava sospesa, come un respiro tenuto in gola per non rompere l’incanto.',
  'Sono entrato nei vicoli quando la luce scendeva obliqua tra i balconi. Le sciarpe erano già al collo, le bandiere già stese da una finestra all’altra come il bucato di una speranza lunga trentatré anni. Ogni muro aveva un volto, e ogni volto aveva un Diego.',
  'Poi qualcuno ha acceso un fumogeno e l’aria è diventata azzurra. Poi verde. Poi rosa. Un uomo con la parrucca blu alzava le braccia come si fa davanti al mare; un altro ha sollevato la maglia per mostrare il suo santo, inciso sulla pelle. Nessuno si conosceva, e tutti si riconoscevano.',
  'In mezzo a quel fumo ho visto una mamma con la sua bambina in braccio. La piccola, con una mascherina sugli occhi come quella di Osimhen, l’idolo di quei giorni, teneva il braccio teso verso l’alto e un fumogeno che sprigionava rosso e verde come una torcia, mentre la madre rideva con tutto il viso, come se intorno non ci fosse nient’altro. È un ricordo bellissimo, uno dei più belli che porto con me da quella giornata. Ho pensato che il vero scudetto fosse quello: non una coppa, ma una bambina che un giorno racconterà di esserci stata, anche se non ricorderà niente.',
  'L’attesa ha una luce tutta sua. Non è quella dorata dei tramonti da cartolina, ma una luce sporca, mossa, piena di fumo, che entra negli occhi e li fa lacrimare prima ancora che ci sia un motivo. È la luce di chi sta per essere felice e ancora ha paura di crederci.',
  'Fotografare in quelle ore è come camminare dentro una preghiera collettiva. Non si cerca l’istante decisivo: si aspetta che sia lui ad accorgersi di te. La macchina fotografica diventa un orecchio più che un occhio, e quello che ascolta è un respiro solo, di migliaia di persone, trattenuto.',
  'A notte il respiro è diventato grido, e il grido, per qualcuno, lacrime. Ma io tengo caro il pomeriggio: il momento in cui una città intera ancora non sa di aver vinto, e per questo è bellissima.',
  'Per questo comincio da qui, da un pomeriggio e non da una vittoria. Le storie, come le fotografie, hanno più verità quando le si guarda un attimo prima che accadano. Forse le fotografie migliori sono sempre quelle di un attimo prima.'],
  en:{t:'Before the Cry',d:'9 November 2026',x:'The afternoon in Naples, when a whole city holds its breath.',a:'A mother smiles as she holds her daughter, who, wearing a mask over her eyes like Osimhen’s, raises a red and green flare in an alley in Naples',p:[
  'There is a moment before every celebration that nobody photographs. It isn’t the roar and it isn’t the tears: it’s the afternoon. In Naples, on 4 May 2023, it was the colour of waiting.',
  'Thirty-three years is a long time. It is a whole life for those who counted them one by one, and a family tale for those too young to remember them. In those hours the city seemed suspended, like a breath held in the throat so as not to break the spell.',
  'I walked into the alleys as the light fell slanting between the balconies. Scarves were already around necks, flags already strung from one window to the next like the washing of a hope thirty-three years long. Every wall had a face, and every face had a Diego.',
  'Then someone lit a flare and the air turned sky blue. Then green. Then pink. A man in a blue wig raised his arms the way you do in front of the sea; another lifted his shirt to show his saint, inked on his skin. Nobody knew each other, and everyone recognised each other.',
  'In the middle of that smoke I saw a mother with her little girl in her arms. The child, wearing a mask over her eyes like Osimhen’s, the idol of those days, held her arm stretched upward with a flare pouring out red and green like a torch, while her mother laughed with her whole face, as if there were nothing else around. It is a beautiful memory, one of the most beautiful I carry from that day. I thought that was the real Scudetto: not a trophy, but a little girl who will one day say she was there, even though she won’t remember a thing.',
  'Waiting has a light all of its own. Not the golden light of postcard sunsets, but a dirty, restless light, full of smoke, that gets into your eyes and makes them water before there is even a reason. It is the light of people about to be happy who are still afraid to believe it.',
  'Photographing in those hours is like walking inside a collective prayer. You don’t look for the decisive moment: you wait for it to notice you. The camera becomes an ear more than an eye, and what it hears is a single breath, thousands of people’s, held.',
  'By night the breath became a shout, and the shout, for some, tears. But I hold the afternoon dear: the moment when a whole city still doesn’t know it has won, and that is why it is beautiful.',
  'That is why I start here, from an afternoon and not from a victory. Stories, like photographs, hold more truth when you look at them a moment before they happen. Maybe the best photographs are always the ones from a moment before.']}}
];
/* Per aggiungere un articolo: {id:'titolo-breve',t:'Titolo',d:'9 novembre 2026',x:'Anteprima di una riga',img:'img/blog-01.jpg',p:['Primo paragrafo','Secondo paragrafo'],en:{t,d,x,a,p:[...]}} */
const SUBSCRIBE_URL=''; /* endpoint di un servizio newsletter (es. Buttondown/Formspree): se vuoto, il modulo apre una mail a info@bonesph.com */
const isProd=()=>/(^|\.)bonesph\.com$|\.github\.io$/.test(location.hostname);
function postUrl(x){return isProd()?location.origin+(LANG==='en'?'/en':'')+'/blog/'+x.id+'/':location.href.split('#')[0]+'#blog-'+x.id}
function subBox(){return `<form class="sb" id="sf" novalidate><label for="se">${esc(t('sbLabel'))}</label><div class="sf"><input id="se" name="email" type="email" required autocomplete="email" placeholder="${esc(t('sbPh'))}"><button type="submit">${esc(t('sbBtn'))}</button></div><p class="nt" id="sm" role="status">${esc(t('sbNote'))}${isProd()?t('sbRss'):''}</p></form>`}
function bindSub(){const f=$('#sf');if(!f)return;f.onsubmit=e=>{e.preventDefault();const em=$('#se').value.trim(),m=$('#sm');if(!/^\S+@\S+\.\S+$/.test(em)){m.textContent=t('sbBad');return}
 if(SUBSCRIBE_URL){fetch(SUBSCRIBE_URL,{method:'POST',headers:{'Accept':'application/json'},body:new FormData(f)}).then(r=>{m.textContent=r.ok?t('sbOk'):t('sbErr');if(r.ok)f.reset()}).catch(()=>{m.textContent=t('sbErr')});return}
 location.href='mailto:info@bonesph.com?subject='+encodeURIComponent(t('sbSubj'))+'&body='+encodeURIComponent(t('sbBody')+em);
 m.textContent=t('sbMail')}}
function blog(){app.innerHTML=`<div class="fade colb"><h1 class="pt">Blog</h1><p class="sub">${esc(t('blSub'))}</p>${BLOG.length?`<div class="bl">${BLOG.map(x=>`<a href="#blog-${x.id}"><div class="bd">${esc(pick(x,'d'))}</div><div class="bt">${bi(pick(x,'t'))}</div><p class="bx">${esc(pick(x,'x')||'')}</p></a>`).join('')}</div>`:`<div class="big it" style="max-width:640px"><p>${esc(t('blSoon'))}</p></div>`}${subBox()}</div>`;bindSub()}
function shareBar(x){const u=encodeURIComponent(postUrl(x)),tt=encodeURIComponent(pick(x,'t')+' · GENZO');
const I={wa:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/></svg>',fb:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',x:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4l12 16h-4z"/><path d="M20 4l-6.5 7M4 20l6.5-7"/></svg>',mail:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',link:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>'};
return `<div class="share"><span class="lb">${esc(t('share'))}</span><a href="https://wa.me/?text=${tt}%20${u}" target="_blank" rel="noopener" aria-label="${esc(t('shWa'))}" title="WhatsApp">${I.wa}</a><a href="https://www.facebook.com/sharer/sharer.php?u=${u}" target="_blank" rel="noopener" aria-label="${esc(t('shFb'))}" title="Facebook">${I.fb}</a><a href="https://twitter.com/intent/tweet?text=${tt}&url=${u}" target="_blank" rel="noopener" aria-label="${esc(t('shX'))}" title="X">${I.x}</a><a href="mailto:?subject=${tt}&body=${u}" aria-label="${esc(t('shMail'))}" title="Email">${I.mail}</a><button type="button" id="cp" aria-label="${esc(t('shCopy'))}" title="${esc(t('shCopyT'))}">${I.link}</button><span class="ok" id="cpok" role="status"></span></div>`}
function bindShare(){const b=document.getElementById('cp'),m=document.getElementById('cpok');if(!b)return;b.onclick=()=>{const px=BLOG.find(q=>'blog-'+q.id===location.hash.slice(1)),u=px?postUrl(px):location.href;const done=()=>{m.textContent=t('shDone');setTimeout(()=>{m.textContent=''},2000)};
const fb=()=>{const a=document.createElement('textarea');a.value=u;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()};
try{navigator.clipboard.writeText(u).then(done,fb)}catch(e){fb()}}}
function bi(s){return '<b>'+esc(s.charAt(0))+'</b>'+esc(s.slice(1))}
function fit(){const a=document.querySelector('.post.fr');if(a)a.style.setProperty('--ph',Math.max(240,innerHeight-a.getBoundingClientRect().top-18)+'px')}
addEventListener('resize',fit);
function post(x){const ps=pick(x,'p')||[];app.innerHTML=`<div class="fade colp"><a class="back" href="#blog">← Blog</a><article class="post fr"><div class="pt0"><p class="bd">${esc(pick(x,'d'))}</p><h1>${bi(pick(x,'t'))}</h1></div><div class="ps" tabindex="0" role="region" aria-label="${esc(pick(x,'t'))}">${ps.map((p,i)=>i?`<p>${esc(p)}</p>`:`<p><span class="cap">${esc(p.charAt(0))}</span>${esc(p.slice(1))}</p>`).join('')}${x.img?`<svg class="seal" viewBox="0 0 100 100" role="img" aria-label="${esc(t('seal'))}"><use href="#hanko"/></svg><img src="${x.img}" alt="${esc(pick(x,'a')||pick(x,'t'))}">`:''}${x.ig?`<p class="ig"><a href="${x.ig}" target="_blank" rel="noopener" aria-label="Instagram @bones_p75" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg></a></p>`:''}${shareBar(x)}${subBox()}</div></article></div>`;document.body.classList.add('postv');fit();bindShare();bindSub()}
function route(){clearInterval(heroT);const h=(location.hash||'#home').slice(1);document.body.classList.toggle('home',h==='home');document.body.classList.remove('postv');cur=null;
 document.querySelectorAll('nav a').forEach(a=>{const n=a.dataset.n;const on=h===n||(n==='work'&&PROJ.some(p=>p.id===h&&!p.soon))||(n==='blog'&&h.indexOf('blog-')===0);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
 const p=PROJ.find(q=>q.id===h&&!q.soon);
 if(p)proj(p);else if(h==='work'||PROJ.some(q=>q.id===h))work();else if(h==='gallery')gallery();else if(h==='progress')progress();else if(h==='blog')blog();else if(h.indexOf('blog-')===0&&BLOG.some(q=>'blog-'+q.id===h))post(BLOG.find(q=>'blog-'+q.id===h));else if(h==='prints')prints();else if(h==='profile')profile();else if(h==='contact')contact();else home();
 window.scrollTo(0,0)}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(!cur)return;if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});
applyLang();
route();
</script>
</body>
</html>
